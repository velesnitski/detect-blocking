name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:   # allow running the full xray-suite on demand (e.g. from dev)

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -S warning
        with:
          ignore_paths: tests

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked credentials / fleet infra (banned strings + generic creds)
        # The banned VALUES are not in the repo (they ARE secrets); set them as the
        # SECRET_SCAN_BANNED repo secret (pipe-joined ERE) to enable layer 1 in CI.
        # If unset, only the generic-credential layer runs (still catches UUIDs /
        # keys / public IPs); the local pre-commit hook enforces the full list.
        env:
          SECRET_SCAN_BANNED: ${{ secrets.SECRET_SCAN_BANNED }}
        run: bash scripts/secret-scan.sh

  xray-suite:
    # Installs xray-core (a single Go binary) so the Xray/Reality stealth probes
    # (11-26) — the core value of the tool — get real regression coverage. It's the
    # slow/expensive job, so it runs only on push to MAIN (i.e. per release) and on
    # manual dispatch — NOT on every dev push (Actions-minute budget). The fast jobs
    # below cover dev pushes.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    name: full suite (with xray-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install xray-core
        run: |
          go install github.com/xtls/xray-core/main@latest
          sudo install -m 0755 "$(go env GOPATH)/bin/main" /usr/local/bin/xray
          xray version | head -n 1
      - name: Install jq
        run: command -v jq || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Run full test suite
        # The whole suite; with xray present the tunnel probes actually execute.
        # test_smoke depends on live DNS to www.example.com and can flake on a
        # runner with a broken resolver — re-run the job if only smoke fails.
        # Tests must use 127.0.0.1:closed-port for connect-failure fixtures (instant
        # ECONNREFUSED); TEST-NET 192.0.2.x silently drops and hangs xray ~75s/connect.
        run: bash tests/run.sh
        timeout-minutes: 20

  syntax-and-smoke:
    name: syntax + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Print tool versions
        run: |
          bash --version | head -n 1
          openssl version
          curl --version | head -n 1

      - name: Syntax check
        run: bash -n detect_blocking.sh

      - name: Help / version flags
        run: |
          bash detect_blocking.sh --version
          bash detect_blocking.sh --help

      - name: Smoke test against demo target
        run: bash tests/test_smoke.sh
        timeout-minutes: 2

      - name: Repo data guard (addresses / magnitudes / country footprint)
        # Cheap and network-free, so it belongs in the fast job rather than the
        # main-only full suite: a real address or a fleet magnitude should fail on
        # the dev push that introduces it, not at merge time.
        run: bash tests/test_data_guard.sh

      - name: DoH-compromise simulation
        run: bash tests/test_doh_compromise.sh
        timeout-minutes: 2

      - name: JSON output schema
        run: |
          # Ensure jq is available (preinstalled on GitHub runners; this is a guard).
          command -v jq || { sudo apt-get update && sudo apt-get install -y jq || brew install jq; }
          bash tests/test_json.sh
        timeout-minutes: 2

      - name: --watch loop emits ndjson
        run: bash tests/test_watch.sh
        timeout-minutes: 2

      - name: --from-file batch emits ndjson-per-host
        run: bash tests/test_from_file.sh
        timeout-minutes: 2

      - name: --pcap creates capture or gracefully degrades
        run: bash tests/test_pcap.sh
        timeout-minutes: 2

      - name: --xray-config-json schema + graceful degradation
        run: bash tests/test_xrayjson.sh
        timeout-minutes: 2

      - name: Subscription + fleet-walk pipeline (hermetic — local fake panel)
        # Exercises --subscription … --sub-test all end to end: a local stdlib HTTP
        # server (UA gate + 302 cookie challenge) serves a synthetic sub of SAFE
        # placeholders against loopback closed ports, plus the pure helpers behind
        # the tells / remediation plan / table alignment. No real infra, no secrets.
        run: |
          for t in test_subscription test_subscription_http test_fleet_tells test_fleet_plan test_signal_matrix test_conn_limit test_yt_reach test_wpad; do
            echo "== $t =="; bash "tests/$t.sh" || exit 1
          done
        timeout-minutes: 3

      - name: --only / --skip flag wiring
        run: |
          # Sanity: --only dns,tcp must print only those two probe headers.
          out=$(bash detect_blocking.sh --only dns,tcp www.example.com 2>&1)
          echo "$out" | grep -q "1. DNS resolution" || { echo "FAIL: DNS missing"; exit 1; }
          echo "$out" | grep -q "2. TCP reachability" || { echo "FAIL: TCP missing"; exit 1; }
          echo "$out" | grep -q "3. TLS handshake" && { echo "FAIL: TLS should be skipped"; exit 1; }
          echo "PASS: --only flag respected"
        timeout-minutes: 2
