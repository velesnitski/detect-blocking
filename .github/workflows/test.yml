name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -S warning
        with:
          ignore_paths: tests

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked credentials / fleet infra (banned strings + generic creds)
        # The banned VALUES are not in the repo (they ARE secrets); set them as the
        # SECRET_SCAN_BANNED repo secret (pipe-joined ERE) to enable layer 1 in CI.
        # If unset, only the generic-credential layer runs (still catches UUIDs /
        # keys / public IPs); the local pre-commit hook enforces the full list.
        env:
          SECRET_SCAN_BANNED: ${{ secrets.SECRET_SCAN_BANNED }}
        run: bash scripts/secret-scan.sh

  syntax-and-smoke:
    name: syntax + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Print tool versions
        run: |
          bash --version | head -n 1
          openssl version
          curl --version | head -n 1

      - name: Syntax check
        run: bash -n detect_blocking.sh

      - name: Help / version flags
        run: |
          bash detect_blocking.sh --version
          bash detect_blocking.sh --help

      - name: Smoke test against demo target
        run: bash tests/test_smoke.sh
        timeout-minutes: 2

      - name: DoH-compromise simulation
        run: bash tests/test_doh_compromise.sh
        timeout-minutes: 2

      - name: JSON output schema
        run: |
          # Ensure jq is available (preinstalled on GitHub runners; this is a guard).
          command -v jq || { sudo apt-get update && sudo apt-get install -y jq || brew install jq; }
          bash tests/test_json.sh
        timeout-minutes: 2

      - name: --watch loop emits ndjson
        run: bash tests/test_watch.sh
        timeout-minutes: 2

      - name: --from-file batch emits ndjson-per-host
        run: bash tests/test_from_file.sh
        timeout-minutes: 2

      - name: --pcap creates capture or gracefully degrades
        run: bash tests/test_pcap.sh
        timeout-minutes: 2

      - name: --xray-config-json schema + graceful degradation
        run: bash tests/test_xrayjson.sh
        timeout-minutes: 2

      - name: Subscription + fleet-walk pipeline (hermetic — local fake panel)
        # Exercises --subscription … --sub-test all end to end: a local stdlib HTTP
        # server (UA gate + 302 cookie challenge) serves a synthetic sub of SAFE
        # placeholders against loopback closed ports, plus the pure helpers behind
        # the tells / remediation plan / table alignment. No real infra, no secrets.
        run: |
          for t in test_subscription test_subscription_http test_fleet_tells test_fleet_plan test_signal_matrix test_wpad; do
            echo "== $t =="; bash "tests/$t.sh" || exit 1
          done
        timeout-minutes: 3

      - name: --only / --skip flag wiring
        run: |
          # Sanity: --only dns,tcp must print only those two probe headers.
          out=$(bash detect_blocking.sh --only dns,tcp www.example.com 2>&1)
          echo "$out" | grep -q "1. DNS resolution" || { echo "FAIL: DNS missing"; exit 1; }
          echo "$out" | grep -q "2. TCP reachability" || { echo "FAIL: TCP missing"; exit 1; }
          echo "$out" | grep -q "3. TLS handshake" && { echo "FAIL: TLS should be skipped"; exit 1; }
          echo "PASS: --only flag respected"
        timeout-minutes: 2
